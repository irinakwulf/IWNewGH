{% extends "base.html" %}

{% block title %}{{ error.name }} ({{ error.code }}){% endblock %}

{% block content %}
<div class="empty-state">
  <h1>{{ error.name }} ({{ error.code }})</h1>
  <p>{{ error.description }}</p>
  <div class="row">
    <a class="button button--secondary" href="{{ url_for('dashboard.index') }}">Back to the dashboard</a>
  </div>
</div>
{% endblock %}
